<!DOCTYPE html>
<html>
<head>
    <title>Quiz Application</title>
</head>
<body>

<h2>JavaScript Quiz</h2>

<p>1. Which language is used for web page interactivity?</p>

<input type="radio" name="q1" value="HTML"> HTML<br>
<input type="radio" name="q1" value="JavaScript"> JavaScript<br>
<input type="radio" name="q1" value="CSS"> CSS<br><br>

<button onclick="checkAnswer()">Submit</button>

<h3 id="result"></h3>

<script>
function checkAnswer() {

    let answer = document.querySelector(
        'input[name="q1"]:checked'
    );

    if (answer == null) {
        document.getElementById("result").innerHTML =
        "Please Select an Answer";
        return;
    }

    if (answer.value == "JavaScript") {
        document.getElementById("result").innerHTML =
        "Correct Answer! Score: 1/1";
    }
    else {
        document.getElementById("result").innerHTML =
        "Wrong Answer! Score: 0/1";
    }
}
</script>

</body>
</html>
