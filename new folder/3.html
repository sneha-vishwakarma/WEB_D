<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
</head>
<body>
    <h2>Registration Form</h2>

    <form>
        Name:
        <input type="text">
        <br><br>

        Email:
        <input type="email">
        <br><br>

        Mobile:
        <input type="number">
        <br><br>

        Gender:
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
        <br><br>

        <button type="submit">Register</button>
    </form>
</body>
</html>
