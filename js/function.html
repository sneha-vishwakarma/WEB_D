<!DOCTYPE html>
<html>
<head>
    <title>Arrow Function</title>
</head>
<body>

    <h2>Arrow Function Example</h2>

    <button onclick="calculate()">Calculate</button>

    <h3 id="result"></h3>

    <script>
        const add = (a, b) => a + b;

        function calculate() {
            let answer = add(20, 30);

            document.getElementById("result").innerHTML =
            "Addition = " + answer;
        }
    </script>

</body>
</html>
