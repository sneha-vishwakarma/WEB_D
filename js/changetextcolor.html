<!DOCTYPE html>
<html>
<head>
    <title>Change Text Color</title>
</head>
<body>

    <h2 id="heading">Welcome to JavaScript</h2>

    <button onclick="changeColor()">Change Color</button>

    <script>
        function changeColor() {
            document.getElementById("heading").style.color = "blue";
        }
    </script>

</body>
</html>
