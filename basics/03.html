<!DOCTYPE html>
<html>
<head>
    <title>Stopwatch</title>
</head>
<body>

    <h2>Stopwatch</h2>

    <h1 id="time">0</h1>

    <button onclick="start()">Start</button>
    <button onclick="stop()">Stop</button>
    <button onclick="reset()">Reset</button>

    <script>
        let seconds = 0;
        let timer;

        function start() {
            if (!timer) {
                timer = setInterval(() => {
                    seconds++;
                    document.getElementById("time").innerHTML =
                        seconds + " Seconds";
                }, 1000);
            }
        }

        function stop() {
            clearInterval(timer);
            timer = null;
        }

        function reset() {
            stop();
            seconds = 0;
            document.getElementById("time").innerHTML =
                "0 Seconds";
        }
    </script>

</body>
</html>
