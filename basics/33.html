<!DOCTYPE html>
<html>
<head>
    <title>Hamburger Menu</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
        }

        nav {
            background: navy;
            padding: 15px;
            color: white;
        }

        button {
            font-size: 25px;
            background: none;
            color: white;
            border: none;
            cursor: pointer;
        }

        #menu {
            display: none;
            background: lightblue;
            padding: 15px;
        }

        #menu a {
            display: block;
            padding: 10px;
            text-decoration: none;
            color: black;
        }

        #menu.show {
            display: block;
        }
    </style>
</head>
<body>

<nav>
    <button onclick="toggleMenu()">☰</button>
    My Website
</nav>

<div id="menu">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
</div>

<script>
function toggleMenu() {
    document.getElementById("menu").classList.toggle("show");
}
</script>

</body>
</html>
