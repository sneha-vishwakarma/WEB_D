<!DOCTYPE html>
<html>
<head>
    <title>Theme Changer</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 50px;
            background: white;
            color: black;
            transition: 0.3s;
        }

        .dark {
            background: #222;
            color: white;
        }

        button {
            padding: 10px 20px;
        }
    </style>
</head>
<body>

    <h1>Welcome to My Website</h1>

    <p>Click below to change the theme.</p>

    <button onclick="changeTheme()">Change Theme</button>

    <script>
        function changeTheme() {
            document.body.classList.toggle("dark");
        }
    </script>

</body>
</html>
