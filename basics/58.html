<!DOCTYPE html>
<html>
<head>
    <title>Typing Speed Test</title>
</head>
<body>

    <h2>Typing Speed Test</h2>

    <p id="sentence">JavaScript makes websites interactive.</p>

    <textarea id="typing" placeholder="Start typing here..."
              rows="4" cols="35"></textarea>

    <h3 id="result">Time: 0 seconds</h3>

    <button onclick="checkSpeed()">Check Speed</button>

    <script>
        let startTime = null;

        document.getElementById("typing").addEventListener("input", function() {
            if (startTime === null && this.value.length > 0) {
                startTime = Date.now();
            }
        });

        function checkSpeed() {

            let typed = document.getElementById("typing").value;
            let original = document.getElementById("sentence").innerText;

            if (startTime === null || typed.trim() === "") {
                alert("Please type something first!");
                return;
            }

            let time = (Date.now() - startTime) / 1000;
            let minutes = time / 60;

            let words = typed.trim().split(/\s+/).length;
            let speed = Math.round(words / minutes);

            document.getElementById("result").innerHTML =
                "Time: " + time.toFixed(1) +
                " seconds<br>Typing Speed: " + speed +
                " WPM<br>Exact Match: " + (typed === original);
        }
    </script>

</body>
</html>
