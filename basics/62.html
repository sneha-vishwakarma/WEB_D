<!DOCTYPE html>
<html>
<head>
    <title>Mouse Tracker</title>

    <style>
        #area {
            width: 300px;
            height: 200px;
            background: lightblue;
            margin: 20px auto;
            text-align: center;
            padding-top: 30px;
        }
    </style>
</head>
<body>

    <h2>Mouse Position Tracker</h2>

    <div id="area">
        Move your mouse here!
    </div>

    <h3 id="result"></h3>

    <script>
        let area = document.getElementById("area");

        area.addEventListener("mousemove", function(event) {

            let x = event.offsetX;
            let y = event.offsetY;

            document.getElementById("result").innerHTML =
                "X Position: " + x +
                "<br>Y Position: " + y;
        });
    </script>

</body>
</html>
