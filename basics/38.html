<!DOCTYPE html>
<html>
<head>
    <title>Scroll To Top</title>
    <style>
        body {
            font-family: Arial;
            height: 1500px;
            padding: 20px;
        }

        #topBtn {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<h2>Scroll To Top Example</h2>

<p>Scroll down the page to see the button.</p>

<button id="topBtn" onclick="goToTop()">↑ Top</button>

<script>
let button = document.getElementById("topBtn");

window.onscroll = function() {
    if (window.scrollY > 200) {
        button.style.display = "block";
    } else {
        button.style.display = "none";
    }
};

function goToTop() {
    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}
</script>

</body>
</html>
